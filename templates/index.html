<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#08090d"
>

<title>NEXORA</title>

<link
    rel="stylesheet"
    href="/static/style.css"
>

</head><body><div class="app"><!-- =========================
     SIDEBAR
========================== -->

<aside id="sidebar">

    <div class="sidebar-top">

        <div class="sidebar-title">
            NEXORA
        </div>

        <button
            id="closeSidebar"
            class="icon-btn"
            type="button"
            aria-label="Close sidebar"
        >
            ×
        </button>

    </div>

    <button
        id="newChat"
        type="button"
    >
        + New Chat
    </button>

    <div id="chatHistory"></div>

</aside>


<!-- =========================
     HEADER
========================== -->

<header>

    <div class="header-left">

        <button
            id="menuBtn"
            class="icon-btn"
            type="button"
            aria-label="Open sidebar"
        >
            ☰
        </button>

        <div class="logo">

            <div class="logo-mark">
                N
            </div>

            <span>
                NEXORA
            </span>

        </div>

    </div>


    <div class="header-right">

        <button
            id="settingsBtn"
            class="icon-btn"
            type="button"
            aria-label="Settings"
        >
            ⚙
        </button>

    </div>

</header>


<!-- =========================
     MAIN CHAT
========================== -->

<main>

    <div id="chat">

        <div class="welcome">

            <div class="big-logo">
                N
            </div>

            <h2>
                Welcome to NEXORA
            </h2>

            <p>
                One interface. Every intelligence.
            </p>

        </div>

    </div>

</main>


<!-- =========================
     INPUT AREA
========================== -->

<div class="input-area">

    <div class="input-box">

        <textarea
            id="message"
            rows="1"
            placeholder="Message NEXORA..."
            autocomplete="off"
            spellcheck="true"
            aria-label="Message"
        ></textarea>


        <select
            id="model"
            aria-label="Select AI model"
        >
            <option value="">
                Loading models...
            </option>
        </select>


        <!-- SEND -->

        <button
            id="send"
            type="button"
            aria-label="Send message"
        >
            ➤
        </button>


        <!-- STOP -->

        <button
            id="stopBtn"
            class="stop-btn"
            type="button"
            aria-label="Stop generation"
            hidden
        >
            ■
        </button>

    </div>


    <div class="input-hint">
        NEXORA can make mistakes. Check important information.
    </div>

</div>

    </div>

    <script src="/static/app.js?v=10000"></script>

</body>
</html>
