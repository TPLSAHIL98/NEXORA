<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08090d"
    >

    <title>NEXORA</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="app">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside id="sidebar">

        <div class="sidebar-top">

            <div class="sidebar-brand">

                <div class="logo">
                    N
                </div>

                <div>

                    <strong>
                        NEXORA
                    </strong>

                    <small>
                        AI Workspace
                    </small>

                </div>

            </div>


            <button
                id="closeSidebar"
                type="button"
                aria-label="Close sidebar"
            >
                ×
            </button>

        </div>


        <button
            id="newChat"
            class="new-chat"
            type="button"
        >
            ＋ New Chat
        </button>


        <div id="chatHistory"></div>

    </aside>



    <!-- =========================
         MAIN
    ========================== -->

    <div class="main">


        <!-- HEADER -->

        <header>

            <button
                id="menuBtn"
                class="icon-btn"
                type="button"
                aria-label="Open sidebar"
            >
                ☰
            </button>


            <div class="brand">

                <div class="logo">
                    N
                </div>


                <div>

                    <h1>
                        NEXORA
                    </h1>

                    <span>
                        One interface. Every intelligence.
                    </span>

                </div>

            </div>


            <button
                id="settingsBtn"
                class="icon-btn"
                type="button"
                aria-label="Settings"
            >
                ⚙
            </button>

        </header>



        <!-- =========================
             CHAT
        ========================== -->

        <main id="chat">

            <div class="welcome">

                <div class="big-logo">
                    N
                </div>


                <h2>
                    Welcome to NEXORA
                </h2>


                <p>
                    One interface. Every intelligence.
                </p>

            </div>

        </main>



        <!-- =========================
             COMPOSER
        ========================== -->

        <div class="composer">


            <!-- MODEL SELECTOR -->

            <div class="model-row">

                <select
                    id="model"
                    aria-label="Select AI model"
                >

                    <option value="">
                        Loading models...
                    </option>

                </select>

            </div>



            <!-- MESSAGE INPUT -->

            <div class="input-row">


                <textarea
                    id="message"
                    placeholder="Message NEXORA..."
                    rows="1"
                    aria-label="Message"
                ></textarea>



                <!-- SEND -->

                <button
                    id="send"
                    type="button"
                    aria-label="Send message"
                >
                    ➤
                </button>



                <!-- STOP -->

                <button
                    id="stopBtn"
                    class="stop-btn"
                    type="button"
                    aria-label="Stop generation"
                    hidden
                >
                    ■
                </button>


            </div>

        </div>

    </div>

</div>



<!-- =========================
     JAVASCRIPT
========================== -->

<script src="/static/app.js"></script>

</body>

                    </html>
