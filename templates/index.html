<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#08090d">

    <title>NEXORA AI</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside id="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-logo">
                NEXORA
            </div>

            <button
                id="closeSidebar"
                type="button"
                aria-label="Close sidebar"
            >
                ×
            </button>

        </div>

        <button
            id="newChat"
            class="new-chat"
            type="button"
        >
            + New Chat
        </button>

        <div id="history"></div>

    </aside>


    <!-- HEADER -->
    <header>

        <button
            id="menuBtn"
            class="icon-button"
            type="button"
            aria-label="Open sidebar"
        >
            ☰
        </button>

        <div class="brand">

            <div class="brand-icon">
                N
            </div>

            <span>NEXORA</span>

        </div>

        <div class="model-name">
            Gemini 2.5 Flash
        </div>

    </header>


    <!-- MAIN CHAT -->
    <main>

        <div id="chat">

            <div id="welcome" class="welcome">

                <div class="welcome-logo">
                    N
                </div>

                <h1>
                    Welcome to NEXORA
                </h1>

                <p>
                    Your simple AI assistant.
                </p>

            </div>

        </div>

    </main>


    <!-- MESSAGE INPUT -->
    <div class="input-area">

        <div class="input-box">

            <textarea
                id="message"
                rows="1"
                placeholder="Message NEXORA..."
                autocomplete="off"
                spellcheck="true"
                aria-label="Message NEXORA"
            ></textarea>

            <button
                id="send"
                type="button"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

        <div class="hint">
            NEXORA can make mistakes. Check important information.
        </div>

    </div>

</div>


<script src="/static/app.js?v=20001"></script>

</body>
            </html>
