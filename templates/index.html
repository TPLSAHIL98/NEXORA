<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXORA V2</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">
            <span>NEXORA</span>
            <small>V2</small>
        </div>

        <button
            id="newChat"
            class="new-chat"
        >
            + New Chat
        </button>

    </header>


    <section class="model-selector">

        <button
            class="model-card active"
            data-model="gpt"
        >

            <div class="model-icon gpt-icon">
                G
            </div>

            <div>
                <strong>ChatGPT</strong>
                <span>GPT-6 Astra</span>
            </div>

        </button>


        <button
            class="model-card"
            data-model="claude"
        >

            <div class="model-icon claude-icon">
                C
            </div>

            <div>
                <strong>Claude</strong>
                <span>Fable 5</span>
            </div>

        </button>


        <button
            class="model-card"
            data-model="gemini"
        >

            <div class="model-icon gemini-icon">
                G
            </div>

            <div>
                <strong>Gemini</strong>
                <span>3.7 Flash</span>
            </div>

        </button>

    </section>


    <main
        id="chat"
        class="chat"
    >

        <div
            id="welcome"
            class="welcome"
        >

            <div class="nexora-logo">
                N
            </div>

            <h1>
                What can I help you build?
            </h1>

            <p>
                Ask NEXORA anything.
            </p>

            <div class="suggestions">

                <button data-prompt="Build me a Minecraft Fabric mod">
                    Minecraft mod
                </button>

                <button data-prompt="Create a modern HTML website">
                    Build a website
                </button>

                <button data-prompt="Help me debug my code">
                    Debug code
                </button>

                <button data-prompt="Explain this programming concept">
                    Explain code
                </button>

            </div>

        </div>

    </main>


    <div class="composer-wrapper">

        <form
            id="chatForm"
            class="composer"
        >

            <textarea
                id="message"
                placeholder="Message NEXORA..."
                rows="1"
            ></textarea>

            <button
                id="sendButton"
                type="submit"
            >
                ↑
            </button>

        </form>

        <div class="composer-info">

            <span id="selectedModel">
                ChatGPT · GPT-6 Astra
            </span>

            <span>
                NEXORA V2
            </span>

        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>

    </html>
